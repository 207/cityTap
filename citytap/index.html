    <title>CityTap — Daily geography game</title>
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        background: #0b0b19;
      }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('citytap-theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
