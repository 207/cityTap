# Render Blueprint — CityTap static site
# https://dashboard.render.com/blueprint/new

services:
  - type: web
    name: citytap
    runtime: static
    rootDir: citytap
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_MAPBOX_TOKEN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
